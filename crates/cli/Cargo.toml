[package]
name = "combinator-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Interface en ligne de commande et graphique optionnelle pour Combinator."
repository.workspace = true

[[bin]]
name = "combinator"
path = "src/main.rs"

[[bin]]
name = "combinator-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:slint", "dep:rfd", "dep:slint-build"]
slint-ui = ["gui"]

[dependencies]
combinator-core.workspace = true
anyhow.workspace = true
clap.workspace = true
heic-rs.workspace = true
image.workspace = true
lopdf.workspace = true
natord.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
slint = { workspace = true, optional = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"], optional = true }

[build-dependencies]
slint-build = { workspace = true, optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
thiserror.workspace = true
assert_cmd = "2"
tempfile = "3"
image.workspace = true
predicates = "3"
lopdf.workspace = true
