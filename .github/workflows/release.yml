name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libx11-dev \
            libxkbcommon-dev libwayland-dev desktop-file-utils

      - name: Build CLI
        run: cargo build --release --locked --bin combinator

      - name: Build GUI
        run: cargo build --release --locked --features slint-ui --bin combinator-gui
