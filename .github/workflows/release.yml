name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            archive: tar.gz
          - platform: windows
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Slint Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          PACKAGES=(build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev)
          if apt-cache show libfontconfig-dev >/dev/null 2>&1; then PACKAGES+=(libfontconfig-dev); else PACKAGES+=(libfontconfig1-dev); fi
          if apt-cache show libfreetype-dev >/dev/null 2>&1; then PACKAGES+=(libfreetype-dev); else PACKAGES+=(libfreetype6-dev); fi
          if apt-cache show libgl-dev >/dev/null 2>&1; then PACKAGES+=(libgl-dev); else PACKAGES+=(libgl1-mesa-dev); fi
          sudo apt-get update
          sudo apt-get install -y "${PACKAGES[@]}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ runner.os }}-release-cargo

      - name: Build command-line interface
        run: cargo build --release -p combinator-cli --locked --bin combinator

      - name: Build Slint GUI
        run: cargo build --release -p combinator-cli --locked --features slint-ui --bin combinator-gui

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="combinator-${VERSION}-linux-x86_64"
          rm -rf "dist/${STAGE}" && mkdir -p "dist/${STAGE}"
          cp ./target/release/combinator "dist/${STAGE}/"
          cp ./target/release/combinator-gui "dist/${STAGE}/"
          cp ./README.md ./LICENSE "dist/${STAGE}/"
          cp ./packaging/linux/io.github.Franck-Demongin.Combinator.desktop "dist/${STAGE}/"
          tar -czf "dist/${STAGE}.tar.gz" -C dist "${STAGE}"
          (cd dist && sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256")
          rm -rf "dist/${STAGE}"

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $Env:GITHUB_REF_NAME -replace '^v',''
          $stage = "combinator-$version-windows-x86_64"
          $dist = "dist/$stage"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "./target/release/combinator.exe" "$dist/"
          Copy-Item "./target/release/combinator-gui.exe" "$dist/"
          Copy-Item "./README.md" "$dist/"
          Copy-Item "./LICENSE" "$dist/"
          $archive = "dist/$stage.zip"
          Compress-Archive -Path "$dist/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          Set-Content -Path "$archive.sha256" -NoNewline -Value "$hash  $(Split-Path $archive -Leaf)"
          Remove-Item -Recurse -Force $dist

      - name: Upload release assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: combinator-${{ matrix.platform }}-build
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "## Commits"
            echo
            if [ -n "${previous_tag}" ]; then
              git log "${previous_tag}..HEAD" --pretty=format:'- %s (%h)' | grep -vE '^- chore\(release\)' || true
            else
              git log --pretty=format:'- %s (%h)' | grep -vE '^- chore\(release\)' || true
            fi
          } > release-notes.md
          printf '\n' >> release-notes.md
          echo "Previous tag: ${previous_tag:-<none>}"
          echo "--- Release notes ---"
          cat release-notes.md

      - name: Download release assets
        uses: actions/download-artifact@v8.0.2
        with:
          path: release-input

      - name: Assemble and checksum assets
        run: |
          set -euo pipefail
          mkdir -p release
          find release-input -type f -exec mv {} release/ \;
          find release -type d -empty -delete
          find release -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + > release/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Combinator ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true