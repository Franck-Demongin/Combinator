name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libx11-dev \
            libxkbcommon-dev libwayland-dev desktop-file-utils \
            poppler-utils

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install -y poppler
          refreshenv

      - name: Verify Poppler
        run: pdftoppm -v

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo test
        run: cargo test --workspace --locked

      - name: Cargo build CLI
        run: cargo build --locked -p combinator-cli

      - name: Cargo build GUI
        run: cargo build --locked -p combinator-cli --features gui

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
