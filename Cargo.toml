[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Franck-Demongin"]
description = "Composition automatique de planches PDF, avec interface graphique Slint optionnelle."
repository = "https://github.com/Franck-Demongin/Combinator"
homepage = "https://github.com/Franck-Demongin/Combinator"
readme = "README.md"

[workspace.dependencies]
combinator-core = { path = "crates/core", version = "0.1.0" }

anyhow = "1"
thiserror = "2.0"
tracing = "0.1"

clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
heic-rs = { version = "=0.1.4", default-features = false, features = ["std"] }
lopdf = "0.46"
natord = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }
slint-build = { version = "1.18", default-features = false, features = [
    "compat-1-18",
    "renderer-software",
] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[workspace.lints.rust]
unused = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
