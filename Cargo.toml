[package]
name = "combinator"
version = "0.1.0"
edition = "2024"
description = "Automatic composition of PDF boards from pairs of source images and documents."

[features]
default = []
gui = ["slint-ui"]
slint-ui = ["dep:slint", "dep:rfd", "dep:slint-build"]

[dependencies]
anyhow = "1"
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
], optional = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"], optional = true }

[build-dependencies]
slint-build = { version = "1", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "combinator"
path = "src/main.rs"

[[bin]]
name = "combinator-gui"
path = "src/gui_main.rs"
required-features = ["slint-ui"]
